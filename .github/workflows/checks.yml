name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_ROLE_KEY: test-placeholder
      SPOTIFY_CLIENT_ID: test-placeholder
      SPOTIFY_CLIENT_SECRET: test-placeholder
      SPOTIFY_REFRESH_TOKEN: test-placeholder
      ADMIN_PIN: test-only
      TWITCH_CLIENT_ID: test-placeholder
      TWITCH_CLIENT_SECRET: test-placeholder
      APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:polls
      - run: npm run test:bot-search
      - run: npm run test:stream
      - run: npm run build
